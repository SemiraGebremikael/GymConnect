<mat-icon class="back-icon" (click)="goBack()">arrow_back</mat-icon>

<h2>{{ selectedUser?.fullName || 'Chat' }}</h2>

<div class="chat-wrapper">
  <div class="messages">
    <div *ngFor="let msg of messages"
        [ngClass]="msg.sender?.id === currentUserId ? 'sent' : 'received'"
        class="message">
      {{ msg.content}}
    </div>
  </div>

  <div class="input-area">
    <textarea [(ngModel)]="messageContent" rows="2" placeholder="Write a message..."></textarea>
    <button mat-button (click)="sendMessage()">Send</button>
  </div>
</div>
