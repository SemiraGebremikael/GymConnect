
<app-header (searchEvent)="onSearch($event)"></app-header>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z3" >
  <ng-container matColumnDef="fullName" >
    <th mat-header-cell *matHeaderCellDef>Full Name</th>
    <td mat-cell *matCellDef="let user">{{ user.fullName }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let user">{{ user.city }}</td>
  </ng-container>

  <ng-container matColumnDef="country">
    <th mat-header-cell *matHeaderCellDef>Country</th>
    <td mat-cell *matCellDef="let user">{{ user.country }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"  ></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"  (click)="selectUser(row)" ></tr>
</table>
